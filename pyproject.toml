[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ncodex-trading-core"
version = "0.1.0"
description = "Offline risk screening and decimal-safe paper trading for Ncodex"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
include = ["ncodex*"]

# Explicit entrypoint: ignore unrelated Python apps in upstream submodules.
[tool.vercel]
entrypoint = "app:app"
